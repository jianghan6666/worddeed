name: Software checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install adapter test dependencies
        run: python -m pip install numpy pandas pyarrow
      - name: Test connected runtime
        run: python -m unittest discover -s agent_system/tests -v
      - name: Run fixture and resume
        run: |
          python -S -m agent_system.empirical.demo --out .local/demo
          python -S -m agent_system.empirical.demo --out .local/demo --resume
